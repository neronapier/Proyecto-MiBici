# TC5061: cuenta de GitHub Actions. Sin shell ni tuneles: solo ejecuta el pipeline de MiBici.
Match User mlflow-ci
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
    ForceCommand /usr/local/bin/mlflow-ci-entrar
    MaxSessions 2
    MaxAuthTries 3
    ClientAliveInterval 60
    ClientAliveCountMax 5
